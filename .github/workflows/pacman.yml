name: Atualizar Pac-Man

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: Gerar animações de contribuições
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: LauraEloysa
          games: 'pacman'

      - name: Publicar animações na branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
